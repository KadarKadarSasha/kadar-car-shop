<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table of Cars</title>
    <link rel="stylesheet" href="../assets/css/table.css" />
  </head>
  <body>
    <header>
      <ul>
        <li><a href="../index.html">Home</a></li>
      </ul>
    </header>
    <table>
      <thead>
        <tr>
          <th rowspan="2">Brand</th>
          <th rowspan="2">Model</th>
          <th rowspan="2">Country</th>
          <th colspan="2">Weight kg</th>
          <th rowspan="2">Max speed</th>
          <th rowspan="2">Realise year</th>
        </tr>
        <tr>
          <th>empty</th>
          <th>full</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Ford</td>
          <td>Mustang</td>
          <td>USA</td>
          <td>1564</td>
          <td>2343</td>
          <td>250</td>
          <td>1978</td>
        </tr>
        <tr>
          <td>Focus</td>
          <td>USA</td>
          <td>1050</td>
          <td>1200</td>
          <td>165</td>
          <td>2004</td>
        </tr>
        <tr>
          <td rowspan="2">BMW</td>
          <td>BMW 2</td>
          <td>Germany</td>
          <td>1300</td>
          <td>1760</td>
          <td>235</td>
          <td>1987</td>
        </tr>
        <tr>
          <td>BMW 3</td>
          <td>Germany</td>
          <td>1600</td>
          <td>2034</td>
          <td>274</td>
          <td>1994</td>
        </tr>
        <tr>
          <td rowspan="2">Audi</td>
          <td>Quattro</td>
          <td>Germany</td>
          <td>1500</td>
          <td>1980</td>
          <td>265</td>
          <td>1976</td>
        </tr>
        <tr>
          <td>R8</td>
          <td>Germany</td>
          <td>1586</td>
          <td>1995</td>
          <td>310</td>
          <td>1997</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
